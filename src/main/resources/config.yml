# VOID WEAPON settings. Numeric values are clamped to safe limits in code.
general:
  debug: false
  allowed-game-modes: [SURVIVAL, ADVENTURE]
  # Empty means all worlds are allowed.
  allowed-worlds: []
  # Disable a default input without changing the ability-selection command.
  controls:
    sneak-left-click-arrow-storage: true
    auto-fire-right-click: true
    selected-ability-right-click: true
  # State is written to this file using atomic replacement.
  storage-file: data.yml
  # Arrow storage accepts normal arrows plus the optional types below.
  arrow-storage:
    capacity: 2304
    gui-size: 27
    allow-spectral-arrows: true
    allow-tipped-arrows: true
  # Message strings use legacy color codes and {time}/{weapon} placeholders.
  messages:
    prefix: "§5[VOID WEAPON] "
    no-permission: "§cYou do not have permission to do that."
    invalid-player: "§cThat player must be online."
    invalid-weapon: "§cUnknown weapon. Use /voidweapon list."
    cooldown: "§cThat ability is recharging for {time}s."
    no-ammo: "§cAuto Fire requires 8 stored arrows."
    not-at-forge: "§cLook at a configured forge block to use this menu."
    recipe-locked: "§cThat weapon recipe is locked."
    job-active: "§cYou already have a crafting job or pending reward."
    started: "§aCrafting {weapon} started."
    completed: "§aYour {weapon} is ready. Collect it from your inventory."
    reward-pending: "§eYour weapon is ready, but your inventory is full."
    trust-updated: "§aForge trust updated."
performance:
  # Caps total live projectiles created by abilities.
  max-active-projectiles: 256
crafting:
  duration-seconds: 1200
  # First player to use an unclaimed forge becomes its owner.
  forge:
    material: LODESTONE
    trust-enabled: true
    trusted-can-craft: true
    trusted-can-collect: true
  bossbar:
    enabled: true
    trusted-visibility: false
    color: PURPLE
    style: SOLID
  # Each shape has three rows; every non-space symbol consumes one ingredient.
  recipes:
    auto_bow:
      shape: ["ABA", "CDC", " E "]
      ingredients: {A: STRING, B: DIAMOND, C: IRON_INGOT, D: BOW, E: AMETHYST_SHARD}
    wind_blade:
      shape: [" AB", " AB", " C "]
      ingredients: {A: FEATHER, B: DIAMOND, C: STICK}
    thunder_spear:
      shape: ["  A", " B ", "C  "]
      ingredients: {A: LIGHTNING_ROD, B: TRIDENT, C: NETHERITE_INGOT}
    void_crusher:
      shape: ["ABA", "CDC", " E "]
      ingredients: {A: OBSIDIAN, B: ECHO_SHARD, C: NETHERITE_INGOT, D: NETHERITE_AXE, E: ENDER_EYE}
    blade_of_demon:
      shape: ["ABA", "CDC", " E "]
      ingredients: {A: BLAZE_POWDER, B: NETHERITE_INGOT, C: WITHER_SKELETON_SKULL, D: NETHERITE_SWORD, E: MAGMA_CREAM}
    god_slayer:
      shape: ["ABA", "CDC", " E "]
      ingredients: {A: NETHER_STAR, B: NETHERITE_INGOT, C: ECHO_SHARD, D: NETHERITE_SWORD, E: DRAGON_EGG}
# Damage, range, cooldown, and effect values are clamped by the ability service.
weapons:
  auto_bow:
    abilities:
      auto_fire: {cooldown-seconds: 5, damage: 6.0, range: 48, count: 8, interval-ticks: 2, speed: 3.0, spread: 0.025}
      piercing_shot: {cooldown-seconds: 12, damage: 14.0, range: 48, penetrations: 2, speed: 4.0, spread: 0.0}
      phantom_volley: {cooldown-seconds: 18, damage: 5.0, range: 40, count: 5, spread: 0.12, speed: 2.8}
  wind_blade:
    abilities:
      phantom_dash: {cooldown-seconds: 8, distance: 8.0, speed: 1.8, range: 8, damage: 0.0}
      cyclone_cut: {cooldown-seconds: 10, range: 5.0, damage: 8.0, knockback: 0.7}
      sky_render: {cooldown-seconds: 16, range: 9.0, damage: 10.0, knockback: 1.1, launch: 1.0}
  thunder_spear:
    abilities:
      thunder_throw: {cooldown-seconds: 9, range: 45, damage: 12.0, speed: 3.2, spread: 0.0}
      chain_lightning: {cooldown-seconds: 14, range: 12.0, damage: 8.0, jumps: 4, jump-damage-scale: 0.75}
      storm_god: {cooldown-seconds: 35, range: 9.0, damage: 14.0, targets: 8}
  void_crusher:
    abilities:
      void_smash: {cooldown-seconds: 12, range: 6.0, damage: 11.0, knockback: 1.0}
      gravity_break: {cooldown-seconds: 18, range: 10.0, duration-ticks: 40, pull-strength: 0.45}
      collapse: {cooldown-seconds: 30, range: 8.0, damage: 16.0, targets: 10}
  blade_of_demon:
