      demon_slash: {cooldown-seconds: 7, range: 5.0, damage: 10.0, targets: 3}
      crimson_burst: {cooldown-seconds: 16, range: 6.0, damage: 12.0, targets: 8}
      hellfire_domain: {cooldown-seconds: 35, range: 6.0, damage: 3.0, duration-ticks: 100, interval-ticks: 20, targets: 8}
  god_slayer:
    abilities:
      god_strike: {cooldown-seconds: 20, range: 16.0, damage: 22.0}
      divine_judgment: {cooldown-seconds: 45, range: 10.0, damage: 18.0, targets: 10}